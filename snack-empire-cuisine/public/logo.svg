<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Snack Empire">
  <defs>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b65a"/>
      <stop offset="1" stop-color="#d98a2f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#f4b324"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4b4b"/>
      <stop offset="1" stop-color="#c22a2f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#2a1205" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- burger couronné -->
  <g filter="url(#shadow)" transform="translate(320 104)">
    <!-- couronne -->
    <path d="M-52 -58 L-38 -96 L-18 -66 L0 -104 L18 -66 L38 -96 L52 -58 Z" fill="url(#gold)" stroke="#7a4a00" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="-38" cy="-96" r="7" fill="#ef4b4b" stroke="#7a4a00" stroke-width="3"/>
    <circle cx="0" cy="-104" r="8" fill="#4cc9f0" stroke="#7a4a00" stroke-width="3"/>
    <circle cx="38" cy="-96" r="7" fill="#ef4b4b" stroke="#7a4a00" stroke-width="3"/>
    <!-- pain du dessus -->
    <path d="M-78 -8 C-78 -52 -42 -66 0 -66 C42 -66 78 -52 78 -8 Z" fill="url(#bun)" stroke="#5a2f10" stroke-width="5"/>
    <g fill="#fff4d6">
      <ellipse cx="-34" cy="-40" rx="5" ry="3" transform="rotate(-20 -34 -40)"/>
      <ellipse cx="-8" cy="-50" rx="5" ry="3" transform="rotate(10 -8 -50)"/>
      <ellipse cx="22" cy="-42" rx="5" ry="3" transform="rotate(-15 22 -42)"/>
      <ellipse cx="46" cy="-28" rx="5" ry="3" transform="rotate(25 46 -28)"/>
      <ellipse cx="-52" cy="-22" rx="5" ry="3" transform="rotate(-35 -52 -22)"/>
    </g>
    <!-- salade, fromage, steak -->
    <path d="M-84 -6 Q-70 6 -56 -4 Q-42 8 -28 -4 Q-14 8 0 -4 Q14 8 28 -4 Q42 8 56 -4 Q70 6 84 -6 L84 4 L-84 4 Z" fill="#5cc35a" stroke="#2f6b2a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-80 4 L80 4 L70 22 L40 12 L10 26 L-20 12 L-50 24 L-80 12 Z" fill="#ffd23f" stroke="#a06a00" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-80" y="10" width="160" height="24" rx="12" fill="#6b3418" stroke="#3a1a08" stroke-width="5"/>
    <!-- pain du dessous -->
    <path d="M-74 34 L74 34 C74 52 60 60 40 60 L-40 60 C-60 60 -74 52 -74 34 Z" fill="url(#bun)" stroke="#5a2f10" stroke-width="5"/>
  </g>

  <!-- SNACK -->
  <g filter="url(#shadow)" font-family="'Arial Black', 'Arial Bold', Impact, sans-serif" font-weight="900" text-anchor="middle">
    <text x="320" y="262" font-size="112" fill="none" stroke="#3a1a08" stroke-width="22" stroke-linejoin="round" letter-spacing="2">SNACK</text>
    <text x="320" y="262" font-size="112" fill="url(#gold)" stroke="#7a4a00" stroke-width="4" letter-spacing="2">SNACK</text>
  </g>

  <!-- ruban EMPIRE -->
  <g filter="url(#shadow)">
    <path d="M118 286 L96 300 L118 314 L104 336 L170 336 L170 286 Z" fill="#a51f24"/>
    <path d="M522 286 L544 300 L522 314 L536 336 L470 336 L470 286 Z" fill="#a51f24"/>
    <path d="M140 278 L500 278 L500 344 L140 344 Q160 311 140 278 Z" fill="url(#ribbon)" stroke="#6e1216" stroke-width="5" stroke-linejoin="round"/>
    <text x="320" y="330" font-family="'Arial Black', 'Arial Bold', Impact, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="10">EMPIRE</text>
  </g>
</svg>
