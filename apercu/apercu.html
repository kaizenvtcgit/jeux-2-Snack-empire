<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Street Food Empire – aperçu</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,"Segoe UI",sans-serif}
  canvas{display:block}
  #tag{position:fixed;left:24px;bottom:20px;padding:8px 16px;border-radius:10px;background:rgba(0,0,0,.55);color:#fff;font-weight:700;font-size:20px;letter-spacing:.3px}
  #hud{position:fixed;left:24px;top:20px;display:flex;gap:12px;align-items:center}
  .pill{padding:10px 18px;border-radius:14px;font-weight:800;font-size:26px;color:#fff;background:rgba(20,20,30,.7);box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .rate{font-size:18px;font-weight:700;opacity:.95}
  #panel{position:fixed;right:24px;top:20px;width:290px;display:flex;flex-direction:column;gap:10px}
  .card{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(20,20,30,.72);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .card .ic{font-size:30px}
  .card .t{flex:1;font-weight:700;font-size:15px;line-height:1.25}
  .card .t small{display:block;font-weight:500;opacity:.75;font-size:12px}
  .card button{border:0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:14px;color:#1b1b1b;background:#ffd23f;cursor:pointer}
  .float{position:fixed;transform:translate(-50%,-50%);font-weight:900;font-size:24px;color:#ffe04a;text-shadow:0 2px 0 #7a4a00,0 0 12px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap}
  .lock{position:fixed;transform:translate(-50%,-50%);padding:6px 12px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:15px;white-space:nowrap}
  /* Variantes d'interface selon le style */
  body.toon .pill,body.toon .card{background:#fff;color:#3a2a60;border:4px solid #3a2a60;box-shadow:0 5px 0 #3a2a60;border-radius:20px}
  body.toon .card button{background:#7ee36b;color:#1d4a12;border:3px solid #1d4a12;border-radius:14px;box-shadow:0 3px 0 #1d4a12}
  body.toon .pill,body.toon .card .t{font-family:"Arial Rounded MT Bold","Segoe UI",sans-serif}
  body.toon .float{color:#fff;-webkit-text-stroke:2px #3a2a60;text-shadow:0 4px 0 #3a2a60;font-size:30px}
  body.real .pill,body.real .card{background:rgba(12,12,14,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-weight:600}
  body.real .card button{background:#e8e2d4;border-radius:6px;font-weight:700}
  body.real .float{color:#fff;font-weight:700;font-size:20px;text-shadow:0 1px 4px #000}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

  <div class="card"><div class="ic">🍔</div><div class="t">Burger niv. 4<small>+12 $ par client</small></div><button>250 $</button></div>
  <div class="card"><div class="ic">👨‍🍳</div><div class="t">Embaucher un cuisinier<small>Service 2× plus rapide</small></div><button>900 $</button></div>
  <div class="card"><div class="ic">🌮</div><div class="t">Nouvelle recette : Tacos<small>Attire plus de clients</small></div><button>2 000 $</button></div>
</div>
<div id="tag"></div>

<div class="float" id="f2">+12 $</div>

<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {OutlineEffect} from 'three/addons/effects/OutlineEffect.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const STYLE = new URLSearchParams(location.search).get('style') || 'semi';
const S = {
  semi:{label:'Style 1 · Stylisé semi-réaliste', sky:['#ffb27a','#6d8fe0'], fogC:'#e9a98a', sun:'#ffe0b8', sunI:3.4, hemi:.7, env:.7, exposure:1.05, bloom:.45, fog:.010, sat:1.05},
  real:{label:'Style 2 · Réaliste', sky:['#e88c5a','#27365c'], fogC:'#8a6a66', sun:'#ffb07a', sunI:2.6, hemi:.35, env:.5, exposure:.95, bloom:.7, fog:.022, sat:.72},
  toon:{label:'Style 3 · Cartoon 3D arrondi', sky:['#d9f4ff','#5cbcff'], fogC:'#cdeeff', sun:'#ffffff', sunI:2.4, hemi:1.15, env:0, exposure:1, bloom:0, fog:.006, sat:1.3},
}[STYLE];
document.body.className = STYLE;
document.getElementById('tag').textContent = S.label;
const TOON = STYLE==='toon', REAL = STYLE==='real';

/* ---------- Renderer / scène ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = TOON ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = S.exposure;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, .1, 200);
camera.position.set(12, 8.5, 14.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-.8, 1.1, .6);
controls.update();

let envTex = null;
if(!TOON){ const pm = new THREE.PMREMGenerator(renderer); envTex = pm.fromScene(new RoomEnvironment(), .04).texture; scene.environment = envTex; }

/* ---------- Textures procédurales ---------- */
function canvasTex(w,h,draw,{srgb=true,rep=null}={}){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  if(rep){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]); } return t;
}
function speckle(g,w,h,n,alpha){ for(let i=0;i<n;i++){ const s=Math.random()*2.5+.5; g.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,255,255'},${Math.random()*alpha})`; g.fillRect(Math.random()*w,Math.random()*h,s,s);} }
const grime = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#8a8a8a'; g.fillRect(0,0,w,h); speckle(g,w,h,9000,.35);
  for(let i=0;i<40;i++){ const x=Math.random()*w,y=Math.random()*h,r=20+Math.random()*80; const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba(255,255,255,.18)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,2*r,2*r);} },{srgb:false,rep:[2,2]});

const sky = canvasTex(4,512,(g,w,h)=>{ const gr=g.createLinearGradient(0,h,0,0); gr.addColorStop(0,S.sky[0]); gr.addColorStop(.55,S.sky[1]); gr.addColorStop(1,S.sky[1]); g.fillStyle=gr; g.fillRect(0,0,w,h); });
scene.background = sky;
scene.fog = new THREE.FogExp2(S.fogC, S.fog);

/* ---------- Matériaux ---------- */
let grad=null;
if(TOON){ grad=new THREE.DataTexture(new Uint8Array([90,170,255]),3,1,THREE.RedFormat); grad.minFilter=grad.magFilter=THREE.NearestFilter; grad.needsUpdate=true; }
function col(c){ const k=new THREE.Color(c); if(S.sat!==1){ const h={}; k.getHSL(h); k.setHSL(h.h, Math.min(1,h.s*S.sat), h.l);} return k; }
function M(c,o={}){
  if(TOON) return new THREE.MeshToonMaterial({color:col(c),gradientMap:grad,map:o.map||null,emissive:o.emissive?col(o.emissive):0x000000,emissiveMap:o.emap||null,emissiveIntensity:o.ei??1,transparent:!!o.transparent,opacity:o.opacity??1});
  const Mat = REAL ? THREE.MeshPhysicalMaterial : THREE.MeshStandardMaterial;
  const m = new Mat({color:col(c),roughness:o.r??.6,metalness:o.m??0,map:o.map||null,
    roughnessMap:(REAL && !o.clean)?grime:null, bumpMap:(REAL && o.bump)?grime:null, bumpScale:.4,
    emissive:o.emissive?col(o.emissive):0x000000,emissiveMap:o.emap||null,emissiveIntensity:o.ei??1,
    envMapIntensity:S.env, transparent:!!o.transparent, opacity:o.opacity??1});
  if(o.cc && !TOON){ m.clearcoat = REAL?1:.6; m.clearcoatRoughness=.12; }
  return m;
}
const add=(mesh,x=0,y=0,z=0,parent=scene)=>{ mesh.position.set(x,y,z); parent.add(mesh); return mesh; };
const rbox=(w,h,d,r,mat)=>new THREE.Mesh(new RoundedBoxGeometry(w,h,d,6,r),mat);
const box=(w,h,d,mat)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
const cyl=(rt,rb,h,mat,seg=48)=>new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
const sph=(r,mat)=>new THREE.Mesh(new THREE.SphereGeometry(r,40,28),mat);

/* ---------- Lumières ---------- */
scene.add(new THREE.HemisphereLight(TOON?'#ffffff':S.sky[1], TOON?'#9fd08a':'#5a4a40', S.hemi));
const sun = new THREE.DirectionalLight(S.sun, S.sunI);
sun.position.set(-7, 13, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(REAL?4096:2048, REAL?4096:2048);
Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:60});
sun.shadow.bias=-.0004; sun.shadow.normalBias=.03; sun.shadow.radius = REAL?6:3;
scene.add(sun);

/* ---------- Sol, parking, trottoir ---------- */
const asphalt = canvasTex(512,512,(g,w,h)=>{ g.fillStyle = TOON?'#a9bfd6':(REAL?'#3d3f44':'#5e626b'); g.fillRect(0,0,w,h); if(!TOON) speckle(g,w,h,REAL?26000:9000,REAL?.4:.18);
  if(REAL){ for(let i=0;i<14;i++){ g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=1+Math.random()*2; g.beginPath(); let x=Math.random()*w,y=Math.random()*h; g.moveTo(x,y); for(let k=0;k<6;k++){x+=(Math.random()-.5)*60;y+=(Math.random()-.5)*60;g.lineTo(x,y);} g.stroke(); } } },{rep:[10,10]});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(90,90), M('#ffffff',{map:asphalt,r:REAL?.92:.85,bump:true}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

const lineM = M(TOON?'#ffffff':'#e9e6dc',{r:.7,clean:true});
for(let i=-4;i<=4;i++){ add(box(.14,.012,3.6,lineM), 3+i*2.8, .006, -5.2); }
const sidewalkM = M(TOON?'#f3e6c8':(REAL?'#9b968c':'#c9c2b4'),{r:.9,bump:true});
add(rbox(90,.25,4.5,.06,sidewalkM),0,.125,-9.5);
add(rbox(90,.28,.35,.08,M(TOON?'#ffffff':'#b8b2a6',{r:.8})),0,.14,-7.2);

/* ---------- Immeubles de fond ---------- */
function facade(base,win,lit){ return canvasTex(256,512,(g,w,h)=>{ g.fillStyle=base; g.fillRect(0,0,w,h); if(REAL) speckle(g,w,h,5000,.25);
  for(let y=24;y<h-30;y+=62) for(let x=22;x<w-30;x+=56){ g.fillStyle = Math.random()<lit ? (TOON?'#fff6a8':'#ffd38a') : win; if(TOON){g.beginPath();g.roundRect(x,y,34,44,10);g.fill();} else g.fillRect(x,y,34,44); g.fillStyle='rgba(0,0,0,.22)'; g.fillRect(x-3,y+44,40,5);} }); }
const bCols = TOON ? ['#ff9fb2','#ffd36e','#8fd3ff','#b49cff','#7fe0b0'] : REAL ? ['#8a5a48','#a89a88','#6c6f75','#9a6b52','#7d7266'] : ['#d9805f','#e8c27a','#6f9fd8','#b57fb8','#7fbf9a'];
for(let i=0;i<8;i++){
  const w=6+Math.random()*3, h=7+Math.random()*9, x=-26+i*7.2;
  const mat = M('#ffffff',{map:facade(bCols[i%bCols.length], TOON?'#5a6fb0':(REAL?'#2a3240':'#3c4a66'), REAL?.35:.25), r:.85});
  const b = TOON ? rbox(w,h,5,.5,mat) : box(w,h,5,mat);
  add(b, x, h/2, -14.5);
  add(TOON?rbox(w+.4,.5,5.4,.2,M('#ffffff')):box(w+.3,.35,5.3,M(REAL?'#5a544c':'#efe7da',{r:.8})), x, h+.2, -14.5);
}

/* ---------- Arbres ---------- */
function tree(x,z,s=1){ const g=new THREE.Group();
  add(cyl(.16*s,.22*s,2.2*s,M(TOON?'#a0643c':'#6b4a33',{r:.95,bump:true}),24),0,1.1*s,0,g);
  const leaf=M(TOON?'#5cd35a':(REAL?'#4b6a34':'#4f9a48'),{r:.9,bump:true});
  [[0,2.7,0,1.1],[.7,2.4,.3,.8],[-.6,2.5,-.2,.85],[.1,3.3,-.1,.8]].forEach(([a,b,c,r])=>{ const m=REAL?new THREE.Mesh(new THREE.IcosahedronGeometry(r*s,4),leaf):sph(r*s,leaf); add(m,a*s,b*s,c*s,g); });
  g.position.set(x,0,z); scene.add(g); return g; }
tree(-10,-7.5,1.2); tree(7.5,-8,1.05); tree(-2.5,-8.6,.95); tree(15,-6.8,1.15);

/* ---------- Food truck ---------- */
const truck = new THREE.Group(); scene.add(truck);
const bodyM = M(TOON?'#ff5a6a':(REAL?'#a8322e':'#e63946'),{r:.35,m:REAL?.3:.1,cc:true});
const creamM = M(TOON?'#fff4d6':'#f1e6cf',{r:.45,cc:true});
const glassM = M('#1a2633',{r:.05,m:.2,cc:true,clean:true});
const chromeM = M('#d8dde2',{r:.18,m:1,clean:true});
const rubberM = M('#1b1b1d',{r:.9});
add(rbox(5.4,2.5,2.4,TOON?.45:.22,bodyM), -.6, 1.85, 0, truck);
add(rbox(5.46,.42,2.46,.12,creamM), -.6, .9, 0, truck);
add(rbox(1.9,1.95,2.3,TOON?.5:.3,bodyM), 2.95, 1.55, 0, truck);
add(rbox(1.0,.95,2.2,.15,glassM), 3.55, 2.0, 0, truck);
add(rbox(.35,.2,2.32,.08,chromeM), 3.95, .85, 0, truck);
[[-1.0,'L'],[3.0,'R']].forEach(([x])=>{ add(cyl(.2,.2,.06,M('#fff6c8',{emissive:'#fff1b0',ei:TOON?1:2}),32).rotateZ(Math.PI/2), 3.95, 1.2, .8, truck); add(cyl(.2,.2,.06,M('#fff6c8',{emissive:'#fff1b0',ei:TOON?1:2}),32).rotateZ(Math.PI/2), 3.95, 1.2, -.8, truck); });
// roues
for(const [x,z] of [[-2.3,1.12],[-2.3,-1.12],[1.1,1.12],[1.1,-1.12],[3.0,1.12],[3.0,-1.12]]){
  if(x===1.1) continue;
  const w=new THREE.Group(); const t=cyl(.5,.5,.38,rubberM,48); t.rotation.x=Math.PI/2; w.add(t);
  const h=cyl(.27,.27,.4,chromeM,32); h.rotation.x=Math.PI/2; w.add(h);
  add(w,x,.5,z,truck);
}
// fenêtre de service (côté +z)
add(rbox(3.3,1.25,.12,.08,M('#3a2216',{r:.8})), -.9, 2.05, 1.17, truck);
add(box(3.1,1.05,.05,M('#ffcf8f',{emissive:'#ffb060',ei:TOON?.6:.9})), -.9, 2.05, 1.19, truck);
add(rbox(3.6,.1,.6,.04,chromeM), -.9, 1.45, 1.42, truck);
// silhouette du cuisinier dans la fenêtre
const chefM=M('#ffffff',{r:.8}); add(new THREE.Mesh(new THREE.CapsuleGeometry(.25,.4,8,24),chefM),-1.4,1.9,.95,truck);
add(sph(.2,M('#e0ac80')),-1.4,2.45,.95,truck); add(cyl(.17,.2,.28,chefM,32),-1.4,2.7,.95,truck); add(sph(.2,chefM),-1.4,2.85,.95,truck);
// auvent rayé
const stripes = canvasTex(512,64,(g,w,h)=>{ for(let i=0;i<16;i++){ g.fillStyle = i%2 ? (TOON?'#ffffff':'#f4efe2') : (TOON?'#29b6c8':(REAL?'#245c5a':'#1f9aa6')); g.fillRect(i*w/16,0,w/16,h);} if(REAL) speckle(g,w,h,1500,.2); });
const awn = rbox(3.8,.06,1.3,.03,M('#ffffff',{map:stripes,r:.85})); awn.rotation.x=.38; add(awn,-.9,2.95,1.72,truck);
const valance = canvasTex(512,64,(g,w,h)=>{ for(let i=0;i<16;i++){ g.fillStyle = i%2 ? '#ffffff' : (TOON?'#29b6c8':(REAL?'#245c5a':'#1f9aa6')); g.beginPath(); g.moveTo(i*w/16,0); g.lineTo((i+1)*w/16,0); g.lineTo((i+1)*w/16,h*.5); g.arc((i+.5)*w/16,h*.5,w/32,0,Math.PI); g.closePath(); g.fill(); } });
const val = new THREE.Mesh(new THREE.PlaneGeometry(3.8,.3),M('#ffffff',{map:valance,transparent:true,r:.85})); val.material.side=THREE.DoubleSide; val.material.alphaTest=.5; add(val,-.9,2.62,2.33,truck);
// enseigne lumineuse
const signTex = canvasTex(1024,230,(g,w,h)=>{ g.fillStyle=TOON?'#3a2a60':'#1b1a24'; if(TOON){g.beginPath();g.roundRect(0,0,w,h,60);g.fill();} else g.fillRect(0,0,w,h);
  g.font = TOON ? '900 140px "Arial Rounded MT Bold", "Segoe UI Black", sans-serif' : '900 140px "Arial Black", Impact, sans-serif';
  g.textAlign='center'; g.textBaseline='middle'; g.shadowColor='#ff8a00'; g.shadowBlur=TOON?0:28; g.fillStyle='#ffd23f'; g.fillText('STREET FOOD',w/2,h/2+8);
  if(!TOON){ g.shadowBlur=0; g.strokeStyle='#ffd23f'; g.lineWidth=6; g.strokeRect(14,14,w-28,h-28);} });
const sign = rbox(3.9,.85,.18,.06,M('#ffffff',{map:signTex,emap:signTex,emissive:'#ffffff',ei:TOON?.25:1.4,r:.4})); add(sign,-.7,3.55,.35,truck);
add(cyl(.05,.05,.5,chromeM,16),-2.2,3.2,.35,truck); add(cyl(.05,.05,.5,chromeM,16),.8,3.2,.35,truck);
// cheminée / extracteur
add(cyl(.22,.22,.5,chromeM,32),-2.6,3.3,-.6,truck); add(cyl(.32,.32,.08,chromeM,32),-2.6,3.6,-.6,truck);
// burger + gobelets sur le comptoir
function burger(x,z,s){ const g=new THREE.Group(); const bun=M('#d99a4e',{r:.55});
  add(cyl(.2,.2,.07,bun,32),0,0,0,g); add(cyl(.21,.21,.06,M('#5a2f1c',{r:.7}),32),0,.065,0,g); add(cyl(.225,.225,.02,M('#6cc04a',{r:.6}),32),0,.105,0,g);
  add(cyl(.215,.215,.025,M('#ffc93c',{r:.5}),4),0,.12,0,g); const top=new THREE.Mesh(new THREE.SphereGeometry(.21,32,16,0,Math.PI*2,0,Math.PI/2),bun); add(top,0,.13,0,g);
  g.scale.setScalar(s); add(g,x,1.53,z,truck); }
burger(-1.9,1.45,1.1); burger(-1.35,1.5,1.1);
for(const [x,c] of [[-.2,'#e63946'],[.15,'#2a9d8f'],[.5,'#ffb703']]){ add(cyl(.1,.075,.32,M(c,{r:.5}),32),x,1.66,1.45,truck); add(cyl(.105,.105,.03,M('#ffffff'),32),x,1.83,1.45,truck); }

// tableau menu (ardoise)
const menuTex = canvasTex(256,360,(g,w,h)=>{ g.fillStyle=TOON?'#3a2a60':'#22302a'; g.fillRect(0,0,w,h); g.strokeStyle='#b88a52'; g.lineWidth=18; g.strokeRect(0,0,w,h);
  g.fillStyle='#fff'; g.textAlign='center'; g.font='bold 44px "Segoe UI", sans-serif'; g.fillText('MENU',w/2,72);
  g.font='28px "Segoe UI", sans-serif'; g.textAlign='left'; [['Burger','12 $'],['Tacos','9 $'],['Frites','4 $'],['Soda','3 $']].forEach(([a,b],i)=>{ g.fillStyle='#f4f1e8'; g.fillText(a,30,140+i*52); g.fillStyle='#ffd23f'; g.fillText(b,170,140+i*52); }); });
const board = new THREE.Group();
const pA = rbox(.9,1.25,.06,.03,M('#ffffff',{map:menuTex,r:.8})); pA.rotation.x=-.18; add(pA,0,.62,.08,board);
const pB = rbox(.9,1.25,.06,.03,M('#8a5a34',{r:.8})); pB.rotation.x=.18; add(pB,0,.62,-.08,board);
board.position.set(1.6,0,2.4); board.rotation.y=-.5; scene.add(board);

/* ---------- Guirlande lumineuse ---------- */
const bulbM = M('#fff0c0',{emissive:'#ffc56a',ei:TOON?1:4,r:.3});
const wireM = M('#1f1f1f',{r:.8});
function pole(x,z){ add(cyl(.06,.08,4.2,M(TOON?'#7b5a3a':'#3a3a3a',{r:.6,m:TOON?0:.6}),16),x,2.1,z); }
function garland(a,b){ const pts=[]; for(let i=0;i<=24;i++){ const t=i/24; const p=new THREE.Vector3().lerpVectors(a,b,t); p.y-=Math.sin(Math.PI*t)*.55; pts.push(p);}
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),64,.012,6),wireM));
  for(let i=1;i<24;i+=2){ const b=sph(TOON?.09:.07,bulbM); b.position.copy(pts[i]); b.position.y-=.08; scene.add(b);} }
pole(-7.5,4.5); pole(-7.5,-3.5);
garland(new THREE.Vector3(-7.5,4.1,4.5),new THREE.Vector3(-3.2,3.95,1.1));
garland(new THREE.Vector3(-7.5,4.1,-3.5),new THREE.Vector3(-3.2,3.95,-1.0));
garland(new THREE.Vector3(-7.5,4.1,4.5),new THREE.Vector3(-7.5,4.1,-3.5));
const warm=new THREE.PointLight('#ffb35a',TOON?0:6,8,2); warm.position.set(-.9,2.2,2.2); scene.add(warm);

/* ---------- Tables & parasols ---------- */
function table(x,z,c){ const g=new THREE.Group(); const wood=M(TOON?'#f2b36b':'#a8733f',{r:.7,bump:true}); const metal=M(TOON?'#ffffff':'#2f2f33',{r:.4,m:TOON?0:.8});
  add(cyl(.65,.65,.07,wood,48),0,.78,0,g); add(cyl(.04,.04,.78,metal,16),0,.39,0,g); add(cyl(.3,.32,.04,metal,32),0,.02,0,g);
  for(let k=0;k<3;k++){ const a=k*2.1+.4; add(cyl(.2,.2,.06,wood,32),Math.cos(a)*1.05,.48,Math.sin(a)*1.05,g); add(cyl(.03,.03,.46,metal,12),Math.cos(a)*1.05,.24,Math.sin(a)*1.05,g); }
  add(cyl(.025,.025,2.3,metal,12),0,1.6,0,g);
  const um = canvasTex(512,64,(gg,w,h)=>{ for(let i=0;i<8;i++){ gg.fillStyle=i%2?'#ffffff':c; gg.fillRect(i*w/8,0,w/8,h);} });
  const u=new THREE.Mesh(new THREE.ConeGeometry(1.35,.55,48,1,true),M('#ffffff',{map:um,r:.85})); u.material.side=THREE.DoubleSide; add(u,0,2.6,0,g);
  g.position.set(x,0,z); scene.add(g); }
table(-5.6,-1.6,TOON?'#ff7aa8':(REAL?'#8c3b2f':'#e76f51')); table(-6.2,2.4,TOON?'#ffcc33':(REAL?'#46604a':'#2a9d8f'));

/* ---------- Clients ---------- */
const skins=['#f1c7a0','#c98e62','#8d5a3b','#e8b48a','#f6d2b5','#a8714d'];
const shirts=TOON?['#ff8a5c','#6ec6ff','#b48cff','#7ee36b','#ffd23f','#ff6fa5']:REAL?['#56657a','#8a3d36','#d9d2c4','#3e5a46','#c78f3a','#2c2c34']:['#f4a261','#457b9d','#9b5de5','#2a9d8f','#e9c46a','#ef476f'];
const people=[];
function person(x,z,i,look){ const g=new THREE.Group(); const hs=TOON?1.5:1;
  const pant=M(REAL?'#2b3040':'#334',{r:.85});
  for(const s of[-1,1]) add(new THREE.Mesh(new THREE.CapsuleGeometry(TOON?.1:.085,TOON?.32:.52,8,16),pant),s*.11,TOON?.27:.36,0,g);
  const shirt=M(shirts[i%shirts.length],{r:.85,bump:true});
  add(new THREE.Mesh(new THREE.CapsuleGeometry(TOON?.29:.22,TOON?.3:.5,12,28),shirt),0,TOON?.86:1.06,0,g);
  for(const s of[-1,1]){ const a=new THREE.Mesh(new THREE.CapsuleGeometry(TOON?.075:.06,TOON?.3:.46,8,16),shirt); a.rotation.z=s*.14; add(a,s*(TOON?.36:.28),TOON?.86:1.02,0,g); }
  const skin=M(skins[i%skins.length],{r:.55});
  const head=add(sph(.165*hs,skin),0,TOON?1.42:1.58,0,g);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(.172*hs,40,20,0,Math.PI*2,0,Math.PI*.5),M(['#2b1d14','#5a3a22','#111','#c98a3a','#7a2e1d','#d8c7a0'][i%6],{r:.7}));
  hair.rotation.x=-.35; add(hair,0,(TOON?1.42:1.58)+.02,-.02,g);
  if(!REAL){ const eye=M('#1a1a22',{r:.3}); for(const s of[-1,1]) add(sph(TOON?.035:.022,eye),s*.075*hs,(TOON?1.45:1.6),.155*hs,g); }
  g.position.set(x,0,z); g.lookAt(look.x,0,look.z); scene.add(g); people.push({g,base:Math.random()*6}); return g; }
const queue=[[-.9,3.2],[-2.0,4.0],[-3.0,4.9],[-3.9,5.9],[-4.7,7.0]];
queue.forEach(([x,z],i)=>person(x,z,i,new THREE.Vector3(-.9,0,1.2)));
person(-5.0,-.6,5,new THREE.Vector3(-5.6,0,-1.6));
person(-6.9,3.3,2,new THREE.Vector3(-6.2,0,2.4));

/* ---------- Emplacement verrouillé ---------- */
const plotTex = canvasTex(256,256,(g,w,h)=>{ g.clearRect(0,0,w,h); g.strokeStyle=TOON?'#ffffff':'#ffd23f'; g.lineWidth=10; g.setLineDash([26,18]); g.beginPath(); g.roundRect(12,12,w-24,h-24,30); g.stroke(); });
const plot=new THREE.Mesh(new THREE.PlaneGeometry(4.5,4.5),M('#ffffff',{map:plotTex,transparent:true,emissive:'#ffffff',emap:plotTex,ei:TOON?.3:.6})); plot.material.alphaTest=.3; plot.rotation.x=-Math.PI/2; add(plot,8.8,.02,-1.2);

/* ---------- Petits détails ---------- */
const binM=M(TOON?'#4cc46a':(REAL?'#3b4a3e':'#3a7d44'),{r:.5,m:.2});
add(cyl(.3,.27,.9,binM,40),-3.4,.45,-2.2); add(cyl(.33,.33,.08,binM,40),-3.4,.92,-2.2);
for(const [x,z,r] of [[-3.0,-1.3,.2],[-2.55,-1.6,.6]]){ const c=rbox(.6,.45,.45,.04,M(TOON?'#f2b36b':'#9a6a3c',{r:.85,bump:true})); c.rotation.y=r; add(c,x,.225,z); }

scene.traverse(o=>{ if(o.isMesh && o!==ground){ o.castShadow=true; o.receiveShadow=true; } });
bulbM && scene.traverse(o=>{ if(o.isMesh && o.material===bulbM) o.castShadow=false; });

/* ---------- Rendu ---------- */
let composer=null, outline=null;
if(TOON){ outline=new OutlineEffect(renderer,{defaultThickness:.0045,defaultColor:[.16,.1,.3]}); }
else { composer=new EffectComposer(renderer); composer.addPass(new RenderPass(scene,camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),S.bloom,.45,.85)); composer.addPass(new OutputPass()); }

const f1=document.getElementById('f1'), f2=document.getElementById('f2'), lock=document.getElementById('lock');
function place(el,v){ const p=v.clone().project(camera); el.style.left=((p.x+1)/2*innerWidth)+'px'; el.style.top=((1-p.y)/2*innerHeight)+'px'; }
const clock=new THREE.Clock();
function frame(){ const t=clock.getElapsedTime();
  people.forEach(p=>{ p.g.position.y=Math.abs(Math.sin(t*2+p.base))*.03; });
  place(f1,new THREE.Vector3(-.9,2.4+(t*.4%1)*.3,3.2)); place(f2,new THREE.Vector3(-5.0,2.3,-.6)); place(lock,new THREE.Vector3(8.8,.6,-1.2));
  controls.update();
  if(outline) outline.render(scene,camera); else composer.render();
  requestAnimationFrame(frame); }
frame();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer&&composer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
